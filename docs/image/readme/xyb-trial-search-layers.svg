<svg viewBox="0 0 680 432" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>一次真实检索里技能、执行层与插件各做了什么</title>
  <desc>家属问一句 B7-H3 能进组吗，技能决定怎么找，执行层真的去三个数据源取数，插件决定谁被授权。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="432" fill="#FFFFFF"/>

  <rect x="40" y="40" width="600" height="52" rx="10" fill="#F8FAFA" stroke="#DCE7E3" stroke-width="1"/>
  <text x="64" y="66" fill="#213139" font-size="13" dominant-baseline="central">家属：「国内有什么 B7-H3 的试验，能进组吗？」</text>

  <path d="M340 92 L340 110" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="112" width="600" height="88" rx="10" fill="#EEEDFE" stroke="#CECBF6" stroke-width="1"/>
  <text x="64" y="136" fill="#26215C" font-size="14" font-weight="500" dominant-baseline="central">技能 · 决定「怎么找」</text>
  <text x="64" y="162" fill="#3C3489" font-size="13" dominant-baseline="central">把 condition 从默认的胰腺癌改成 solid tumor，否则漏一半</text>
  <text x="64" y="184" fill="#3C3489" font-size="13" dominant-baseline="central">8 维搜索计划；禁用「推荐」与数值评分；必须标来源</text>

  <path d="M340 200 L340 218" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="600" height="120" rx="10" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="1"/>
  <text x="64" y="246" fill="#04342C" font-size="14" font-weight="500" dominant-baseline="central">执行层 · 真的去三个源取数</text>
  <text x="64" y="272" fill="#0F6E56" font-size="13" dominant-baseline="central">ClinicalTrials.gov（内联工具）→ 20 条，其中中国 11 条</text>
  <text x="64" y="296" fill="#0F6E56" font-size="13" dominant-baseline="central">ChiCTR（MCP）→ 0 条，平台上没有以靶点命名的登记</text>
  <text x="64" y="320" fill="#0F6E56" font-size="13" dominant-baseline="central">登记平台（MCP）→ 待配置本人会话，如实说查不到</text>

  <path d="M340 340 L340 358" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="360" width="600" height="52" rx="10" fill="#FAEEDA" stroke="#FAC775" stroke-width="1"/>
  <text x="64" y="386" fill="#412402" font-size="13" dominant-baseline="central">她拿到的：11 条中国试验，带登记号与原文链接，不排序不推荐</text>
</svg>
