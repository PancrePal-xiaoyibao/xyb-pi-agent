<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外部技能</title>
    <style>
      :root {
        --mint: #299d8c;
        --ink: #213139;
        --body: #48565a;
        --soft: #edf6f3;
        --line: #dce7e3;
        --bg: #ffffff;
        --muted: #8b9a97;
        --warn: #b8791f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8f1ee;
          --body: #b8c7c3;
          --soft: #1f2928;
          --line: #2a3735;
          --bg: #161d1f;
          --muted: #7d8f8c;
          --warn: #d9a94f;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: calc(var(--pi-plugin-titlebar-height, 0px) + 16px) 16px 24px;
        background: var(--bg);
        color: var(--body);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; line-height: 1.7; }
      .disclaimer {
        margin: 14px 0 0; padding: 10px 12px; border-left: 2px solid var(--mint);
        background: var(--soft); border-radius: 0 8px 8px 0; font-size: 11.5px;
        line-height: 1.7; color: var(--body);
      }
      .list { margin-top: 16px; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; margin-bottom: 9px; }
      .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
      .src { color: var(--muted); font-size: 10.5px; margin-bottom: 7px; word-break: break-all; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
      .tag { font-size: 11px; color: var(--mint); border: 1px solid var(--mint); border-radius: 999px; padding: 1px 8px; }
      .tag.warn { color: var(--warn); border-color: var(--warn); }
      .tag.gray { color: var(--muted); border-color: var(--line); }
      .can { margin: 0 0 7px; padding-left: 16px; font-size: 11.5px; line-height: 1.8; }
      .can li { margin: 0; }
      .kv { font-size: 11.5px; line-height: 1.75; }
      .kv b { color: var(--ink); font-weight: 600; }
      .note { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.8; }
      .note ul { margin: 6px 0 0; padding-left: 16px; }
    </style>
  </head>
  <body>
    <h1>外部技能</h1>
    <div class="hint">
      这些技能来自 opencare-skillhub，不是小胰宝自研。每个技能都标了来源、许可，以及在你本机能用到什么程度。
    </div>

    <div class="disclaimer">
      以下内容为公开信息与公开技能的整理，供参考，不能替代医生判断，也不构成入组建议或用药建议。
    </div>

    <div class="list" id="list">
      <div class="card"><h3>正在读取…</h3></div>
    </div>

    <div class="note" id="note"></div>

    <script>
      const bridge = window.pluginBridge;

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function render(skills, outOfScope, disclaimer) {
        const list = document.getElementById("list");
        list.textContent = "";

        for (const s of skills) {
          const card = el("div", "card");
          card.appendChild(el("h3", null, s.name));
          card.appendChild(el("div", "src", `来源：${s.from}${s.upstreamName ? " · " + s.upstreamName : ""}`));

          const row = el("div", "row");
          // readiness 是这张卡片最重要的一栏：说清"到底能不能用"
          const partial = s.readiness && s.readiness.indexOf("可完整使用") !== 0;
          row.appendChild(el("span", "tag" + (partial ? " warn" : ""), s.readiness || "—"));
          row.appendChild(el("span", "tag gray", s.license || "许可未声明"));
          card.appendChild(row);

          const can = el("ul", "can");
          for (const c of s.what || []) can.appendChild(el("li", null, c));
          card.appendChild(can);

          if (s.note) {
            const note = el("div", "kv");
            note.appendChild(el("b", null, "说明："));
            note.appendChild(document.createTextNode(s.note));
            card.appendChild(note);
          }

          list.appendChild(card);
        }

        const note = document.getElementById("note");
        note.textContent = "";
        if (outOfScope && outOfScope.length) {
          note.appendChild(el("div", null, "没有接入的部分："));
          const ul = el("ul");
          for (const line of outOfScope) ul.appendChild(el("li", null, line));
          note.appendChild(ul);
        }
        note.appendChild(el("div", null, disclaimer || ""));
      }

      async function load() {
        try {
          const res = await bridge.invoke("xyb.skillpack.list", {});
          render(res.skills || [], res.outOfScope, res.disclaimer);
        } catch (e) {
          const list = document.getElementById("list");
          list.textContent = "";
          list.appendChild(el("div", "card", "技能清单读取失败，请重新加载插件。"));
        }
      }

      load();
    </script>
  </body>
</html>
