<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>试验来源</title>
    <style>
      :root {
        --mint: #299d8c;
        --ink: #213139;
        --body: #48565a;
        --soft: #edf6f3;
        --line: #dce7e3;
        --bg: #ffffff;
        --muted: #8b9a97;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8f1ee;
          --body: #b8c7c3;
          --soft: #1f2928;
          --line: #2a3735;
          --bg: #161d1f;
          --muted: #7d8f8c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: calc(var(--pi-plugin-titlebar-height, 0px) + 16px) 16px 24px;
        background: var(--bg);
        color: var(--body);
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
      .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; line-height: 1.7; }
      .disclaimer {
        margin: 14px 0 0; padding: 10px 12px; border-left: 2px solid var(--mint);
        background: var(--soft); border-radius: 0 8px 8px 0; font-size: 11.5px;
        line-height: 1.7; color: var(--body);
      }
      .list { margin-top: 16px; }
      .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; margin-bottom: 9px; }
      .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
      .scope { color: var(--muted); font-size: 11px; margin-bottom: 7px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
      .tag { font-size: 11px; color: var(--mint); border: 1px solid var(--mint); border-radius: 999px; padding: 1px 8px; }
      .tag.gray { color: var(--muted); border-color: var(--line); }
      .kv { font-size: 11.5px; line-height: 1.75; }
      .kv b { color: var(--ink); font-weight: 600; }
      .kv.warn b { color: #b8791f; }
      .can { margin: 0; padding-left: 16px; font-size: 11.5px; line-height: 1.8; }
      .can li { margin: 0; }
      .note { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.8; }
    </style>
  </head>
  <body>
    <h1>试验来源</h1>
    <div class="hint">这几处来源覆盖的范围不一样，谁也不能替代谁。下面写清每一处能查什么、需要什么。</div>

    <div class="disclaimer">
      以下为公开试验登记信息的整理，供参考，不能替代医生判断，也不构成入组建议或用药建议。
    </div>

    <div class="list" id="list">
      <div class="card">
        <h3>正在读取…</h3>
      </div>
    </div>

    <div class="note" id="note"></div>

    <script>
      const bridge = window.pluginBridge;

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function render(sources, cdeNote, disclaimer) {
        const list = document.getElementById("list");
        list.textContent = "";

        for (const s of sources) {
          const card = el("div", "card");
          card.appendChild(el("h3", null, s.name));
          card.appendChild(el("div", "scope", s.scope));

          const row = el("div", "row");
          row.appendChild(el("span", "tag", s.kind));
          row.appendChild(el("span", "tag gray", s.plugin));
          card.appendChild(row);

          const can = el("ul", "can");
          for (const c of s.can || []) can.appendChild(el("li", null, c));
          card.appendChild(can);

          const need = el("div", "kv warn");
          need.appendChild(el("b", null, "需要："));
          need.appendChild(document.createTextNode(s.need || "—"));
          card.appendChild(need);

          const limit = el("div", "kv");
          limit.appendChild(el("b", null, "注意："));
          limit.appendChild(document.createTextNode(s.limit || "—"));
          card.appendChild(limit);

          list.appendChild(card);
        }

        const note = document.getElementById("note");
        note.textContent = "";
        note.appendChild(el("div", null, cdeNote || ""));
        note.appendChild(el("div", null, disclaimer || ""));
      }

      async function load() {
        try {
          const res = await bridge.invoke("xyb.trial-sources.list", {});
          render(res.sources || [], res.cdeNote, res.disclaimer);
        } catch (e) {
          const list = document.getElementById("list");
          list.textContent = "";
          list.appendChild(el("div", "card", "来源清单读取失败，请重新加载插件。"));
        }
      }

      load();
    </script>
  </body>
</html>
