name: XYB fork guards

# 小胰宝 fork 自有的门禁，与上游 CI 分开成一个文件（纯新增，永不与上游冲突）。
#
# 只做一件事：**每次改动都检查社区定制有没有被弄坏**。
# 上游同步会覆盖品牌资产、改写 i18n 文案，靠人眼是看不住的——
# 已经实际发生过：de/es/fr 三个语言的帮助菜单被静默漏掉。
#
# 上游巡检与自动同步在 xyb-upstream-autosync.yml（那边会开 PR 或直接推进 main，
# 并在这两个门禁之上再加编译、测试、Rust 与定制层守卫）。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xyb-fork-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: 品牌与插件门禁
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 零依赖校验器：必需字段、权限名、图标 token、MCP 规则、虚假声明
      - name: 插件清单校验
        run: node scripts/xyb-check-plugins.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 安装 Pillow（品牌资产体检需要）
        run: python3 -m pip install --quiet pillow

      # 上游唯一的高频冲突面：i18n 文案里的品牌词
      - name: 品牌文案门禁（i18n 帮助菜单）
        run: python3 scripts/xyb-apply-brand-strings.py --check

      # 品牌二进制资产是否被上游覆盖
      - name: 品牌资产体检
        run: python3 scripts/xyb-restore-brand.py --check

      # 子智能体定义（用官方解析器，需要 shared 产物）
      - uses: pnpm/action-setup@v6

      - name: 安装依赖并构建 shared
        run: |
          pnpm install --frozen-lockfile
          pnpm build:js

      - name: 子智能体定义校验
        run: node scripts/xyb-check-subagents.mjs
